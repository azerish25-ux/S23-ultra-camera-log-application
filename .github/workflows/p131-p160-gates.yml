name: P131-P160 host gates
on:
  push:
    branches: [main]
    paths:
      - scripts/gates/p13*.py
      - scripts/gates/p14*.py
      - scripts/gates/p15*.py
      - scripts/gates/p160*.py
      - scripts/tests/test_p13*.py
      - scripts/tests/test_p14*.py
      - scripts/tests/test_p15*.py
      - scripts/tests/test_p160*.py
      - docs/P13*.md
      - docs/P14*.md
      - docs/P15*.md
      - docs/P160*.md
      - .github/workflows/p131-p160-gates.yml
  pull_request:
    paths:
      - scripts/gates/p13*.py
      - scripts/gates/p14*.py
      - scripts/gates/p15*.py
      - scripts/gates/p160*.py
      - scripts/tests/test_p13*.py
      - scripts/tests/test_p14*.py
      - scripts/tests/test_p15*.py
      - scripts/tests/test_p160*.py
      - .github/workflows/p131-p160-gates.yml
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Run P131 through P160 host gates
        run: |
          set -euo pipefail
          for n in $(seq 131 160); do
            python3 -m unittest discover -s scripts/tests -p "test_p${n}*.py"
          done
