name: Android build and capture smoke tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify wrapper binary
        run: echo '497c8c2a7e5031f6aa847f88104aa80a93532ec32ee17bdb8d1d2f67a194a9c7  gradle/wrapper/gradle-wrapper.jar' | sha256sum -c -
      - name: Install offline RAW developer dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/raw-venv"
          "$RUNNER_TEMP/raw-venv/bin/python" -m pip install -r scripts/requirements-raw.txt
          echo "$RUNNER_TEMP/raw-venv/bin" >> "$GITHUB_PATH"
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
      - name: Host acceptance-check regression tests
        run: python3 -m unittest discover -s scripts/tests -v
      - name: RAW-to-LogC3 synthetic codec evidence (not phone footage)
        run: |
          python3 scripts/raw_fixture.py evidence/raw-logc3
          python3 scripts/raw_to_logc3.py evidence/raw-logc3/synthetic.s23raw --profile evidence/raw-logc3/synthetic-profile.json --output evidence/raw-logc3/synthetic-logc3.mkv
          python3 scripts/raw_to_logc3.py evidence/raw-logc3/synthetic.s23raw --profile evidence/raw-logc3/synthetic-profile.json --codec hevc10 --output evidence/raw-logc3/synthetic-logc3.mp4
      - name: Install pinned Android build and emulator packages
        env:
          ANDROID_HOME: ${{ runner.temp }}/s23log-android-sdk
        run: bash .github/scripts/install-android.sh emulator
      - name: Unit tests, lint and APK builds
        id: build
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:lintRelease :app:assembleDebug :app:assembleRelease :app:assembleDebugAndroidTest
      - name: Verify debug APK signature
        run: $ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose app/build/outputs/apk/debug/app-debug.apk
      - name: Verify release signing fails closed
        run: bash scripts/check_release_signing_config.sh
      - name: Real emulator camera and encoder tests
        run: bash .github/scripts/emulator-test.sh
      - name: Upload installable debug APK
        if: always() && steps.build.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: S23Log-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Package exact source and revision
        if: always()
        run: |
          mkdir -p evidence
          git rev-parse HEAD > evidence/commit.txt
          git archive --format=zip --output=evidence/S23Log-source.zip HEAD
          git ls-tree -r HEAD > evidence/git-tree.txt
      - name: Upload build and device-test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: S23Log-verification
          path: |
            app/build/reports/
            app/build/test-results/
            app/build/outputs/androidTest-results/
            evidence/
          if-no-files-found: warn
