name: Bootstrap checked-in Gradle wrapper
on:
  push:
    branches: [main]
    paths: [.github/workflows/bootstrap-wrapper.yml]
permissions:
  contents: write
jobs:
  wrapper:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Generate official checksum-pinned wrapper
        shell: bash
        run: |
          set -euo pipefail
          test ! -e gradle/wrapper/gradle-wrapper.jar || exit 0
          curl --fail --location --retry 3 https://services.gradle.org/distributions/gradle-9.6.0-bin.zip -o "$RUNNER_TEMP/gradle.zip"
          echo "bbaeb2fef8710818cf0e261201dab964c572f92b942812df0c3620d62a529a01  $RUNNER_TEMP/gradle.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          mkdir "$RUNNER_TEMP/wrapper-project"
          echo "rootProject.name = 'wrapper-bootstrap'" > "$RUNNER_TEMP/wrapper-project/settings.gradle"
          "$RUNNER_TEMP/gradle-9.6.0/bin/gradle" -p "$RUNNER_TEMP/wrapper-project" --no-daemon wrapper --gradle-version 9.6.0 --distribution-type bin --gradle-distribution-sha256-sum bbaeb2fef8710818cf0e261201dab964c572f92b942812df0c3620d62a529a01
          cp -r "$RUNNER_TEMP/wrapper-project/gradle" .
          cp "$RUNNER_TEMP/wrapper-project/gradlew" "$RUNNER_TEMP/wrapper-project/gradlew.bat" .
          echo '497c8c2a7e5031f6aa847f88104aa80a93532ec32ee17bdb8d1d2f67a194a9c7  gradle/wrapper/gradle-wrapper.jar' | sha256sum -c -
          chmod +x gradlew
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties gradlew gradlew.bat
          git commit -m 'build: check in verified Gradle 9.6 wrapper'
          git push origin HEAD:main
