name: Stage final LogC3 review
on:
  push:
    branches: [main]
    paths: [.github/workflows/on-device-review-stage.yml]
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify review patch and publish immutable source blobs only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, subprocess, urllib.request
          repo = 'azerish25-ux/S23-ultra-camera-log-application'
          baseline = '0af398b7b004ed428a86c5e20a9b9af509d8c8d9'
          assert os.environ['GITHUB_REPOSITORY'] == repo
          assert subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip() == baseline
          def api(path, data=None):
              body = None if data is None else json.dumps(data).encode()
              request = urllib.request.Request('https://api.github.com/repos/'+repo+path, data=body,
                  headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'], 'Accept':'application/vnd.github+json',
                           'X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'})
              with urllib.request.urlopen(request,timeout=60) as response: return json.load(response)
          def identity(data):
              return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          sha = '4f409b44517d751864ad800838f9ab5ce82c1e42'
          blob = api('/git/blobs/'+sha)
          assert blob['encoding'] == 'base64'
          transfer = base64.b64decode(blob['content'])
          assert identity(transfer) == sha
          patch = lzma.decompress(base64.b64decode(transfer,validate=True))
          assert len(patch) == 18810
          assert hashlib.sha256(patch).hexdigest() == '91650a5533aa8493b0fe207f4f43949c88392e41fd65b5e2b2b1f26873492164'
          path = pathlib.Path(os.environ['RUNNER_TEMP'])/'review.patch'
          path.write_bytes(patch)
          subprocess.run(['git','apply','--index','--whitespace=error',str(path)],check=True)
          names = subprocess.check_output(['git','diff','--cached','--name-only','-z']).decode().rstrip('\0').split('\0')
          expected = {'README.md','app/src/androidTest/java/com/s23log/probe/RawDevelopmentAndroidTest.kt',
              'app/src/main/java/com/s23log/probe/RawDevelopActivity.kt',
              'app/src/main/java/com/s23log/probe/camera/RawCalibrationSnapshot.kt',
              'app/src/main/java/com/s23log/probe/develop/RawDevelopmentStore.kt',
              'docs/ON_DEVICE_LOGC3.md','scripts/check_raw_development.py','scripts/tests/test_raw_development_evidence.py'}
          assert set(names) == expected
          files = {}
          for name in sorted(names):
              mode = subprocess.check_output(['git','ls-files','--stage','--',name],text=True).split()[0]
              assert mode == '100644'
              data = pathlib.Path(name).read_bytes()
              result = api('/git/blobs',{'encoding':'base64','content':base64.b64encode(data).decode()})
              assert result['sha'] == identity(data)
              files[name] = {'sha':result['sha'],'mode':mode}
          manifest = {'baseline':baseline,'stageCommit':os.environ['GITHUB_SHA'],'files':files}
          pathlib.Path('review-source-manifest.json').write_text(json.dumps(manifest,indent=2)+'\n')
          print(json.dumps(manifest,indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: LogC3-review-source-manifest
          path: review-source-manifest.json
          if-no-files-found: error
