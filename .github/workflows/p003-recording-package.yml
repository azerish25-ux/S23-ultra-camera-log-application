name: Prepare P003 recording candidate
on:
  push:
    branches: [main]
    paths: [.github/workflows/p003-recording-package.yml]
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install existing host prerequisites
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/p003-recording-venv"
          "$RUNNER_TEMP/p003-recording-venv/bin/pip" install -r scripts/requirements-raw.txt
          echo "$RUNNER_TEMP/p003-recording-venv/bin" >> "$GITHUB_PATH"
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
      - name: Reconstruct and verify pinned candidate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess, sys, urllib.request
          sha = '8fd012455f851b2f5518e3762e102eeb0af2da4b'
          req = urllib.request.Request('https://api.github.com/repos/azerish25-ux/S23-ultra-camera-log-application/git/blobs/' + sha,
              headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
          with urllib.request.urlopen(req, timeout=60) as response:
              data = base64.b64decode(json.load(response)['content'])
          assert hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest() == sha
          s = data.decode()
          a = "    tree = api('/git/trees', {'base_tree': parent_tree, 'tree': entries})"
          b = """    if expected_tree:
                  # The connected user account already wrote workflow changes in this tree.
                  # CI writes only non-workflow entries against that exact existing tree.
                  parent_tree = 'db20c49208f5a1ec22e20f60f2d1861ab91e6bdd'
                  entries = [entry for entry in entries if not entry['path'].startswith('.github/workflows/')]
              tree = api('/git/trees', {'base_tree': parent_tree, 'tree': entries})"""
          assert s.count(a) == 1
          s = s.replace(a, b)
          a = "paths = git('diff', '--cached', '--name-only', '-z').decode().strip('\\0').split('\\0')"
          b = """fix_sha = '409047607bc38d84588a1994c799b66f4d76acab'
          fix = base64.b64decode(api('/git/blobs/' + fix_sha)['content'])
          assert object_id('blob', fix) == fix_sha
          fix_path = OUT / 'legacy-query.patch'
          fix_path.write_bytes(fix)
          git('apply', '--check', str(fix_path))
          git('apply', '--index', str(fix_path))
          SOURCE_TREE = 'badc96200cfc0766a4836b7a834def667a81d641'
          assert git('write-tree').decode().strip() == SOURCE_TREE
          """ + a
          assert s.count(a) == 1
          s = s.replace(a, b)
          assert hashlib.sha256(s.encode()).hexdigest() == '697547d09d80e7a4a84842474968d932862b2d7725a566576035912bca1ccd62'
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'p003-recording-package.py'
          path.write_text(s)
          subprocess.run([sys.executable, str(path)], check=True)
          PY
      - name: Retain candidate and verification results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: P003-recording-verified-package
          path: evidence/p003-recording-package/
          include-hidden-files: true
          if-no-files-found: error
