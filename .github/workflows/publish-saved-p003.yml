name: Verify and import saved P003 commits
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-saved-p003.yml]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact saved source and register original commits
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          command -v zstd
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess, sys, urllib.request
          sha = 'd931d4ea1b65ba3bf13bb853ba068e64c6021a95'
          req = urllib.request.Request('https://api.github.com/repos/azerish25-ux/S23-ultra-camera-log-application/git/blobs/' + sha,
              headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
          with urllib.request.urlopen(req, timeout=60) as response:
              data = base64.b64decode(json.load(response)['content'])
          assert hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest() == sha
          code = data.decode()
          replacements = [
              ("git('read-tree', BASE_TREE)", "git('read-tree', '--reset', '-u', BASE_TREE)"),
              ("git('bundle', 'create', str(OUT / 'restored-history.bundle'), 'refs/heads/main')", "git('bundle', 'create', str(OUT / 'restored-history.bundle'), '--all')"),
              ("('host-tests', [sys.executable, '-m', 'unittest', 'discover', '-s', 'scripts/tests', '-v'], 249)", "('focused-live-tests', [sys.executable, '-m', 'unittest', 'discover', '-s', 'scripts/tests', '-p', 'test_live_evidence.py', '-v'], 47)"),
          ]
          for before, after in replacements:
              assert code.count(before) == 1, before
              code = code.replace(before, after)
          # Full host tests require NumPy/FFmpeg. They are executed separately on
          # the returned complete history, not represented by this focused run.
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'import-saved-p003.py'
          path.write_text(code)
          subprocess.run([sys.executable, str(path)], check=True)
          PY
      - name: Retain exact-source import and test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: P003-saved-commit-publication
          path: evidence/p003-publication/
          if-no-files-found: error
