name: Publish verified P005 commits

on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-p005.yml]

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0

      - name: Install existing host prerequisites
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/p005-venv"
          "$RUNNER_TEMP/p005-venv/bin/pip" install -r scripts/requirements-raw.txt
          echo "$RUNNER_TEMP/p005-venv/bin" >> "$GITHUB_PATH"

      - name: Reconstruct and verify saved Git bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, urllib.request

          chunks = [
              ("4d32420ea0b96594c4fbb3321507327a432e2186", "518ba0c0958a9a38b79de34ad07e304b3d2e19dea8aa925e5ca7bedbcd0d5370", 10000),
              ("03aa1b0016c84b3128cc856236dd4b78563f56ad", "6862ecaf346be093e727f8025d11105c682abb2e3f74ce58686dc483cff7eece", 10000),
              ("5709c728c8230ea67bcc2c4866f5f32086ee6133", "193627d5f39023ed031fecb80e558fb78389120a44d70d27aa32f4020712e1d6", 10000),
              ("08808db08cbc242424f80810495c1c639e0f9947", "1390e4e6934e1ca9429f68258c4e469a002c9b71af941fbf173831400a72193c", 10000),
              ("7c5a10c3813eceebe9bbddf5b254938fed779a3a", "7269a7f6aebb8843da38d3f130bb32764d3189137cb5bbbc9e8e067dc7de3a1e", 2500),
              ("e0edca7986735b98e7ddec53e2a2274c97416ca9", "9be59e3456889ac21059a0e57e7088f4b987398885ce383470021e7123c502ef", 2500),
              ("02a2ac29903dee6c09f372d1db87d9a3b411b70b", "fe36b40dfa5f43fe06f03539436fc1bc6409ea77c966bb579cdecdaf9721fb8f", 2500),
              ("9bd44245fc52f8e7dfad17d45e13da24210735d9", "9d65b6c70cd0da5ebe1df8d2c4c27783f3440c0d28996dbcde2ec0e28493675f", 2290),
          ]
          bundle = bytearray()
          for object_sha, expected_sha256, expected_size in chunks:
              request = urllib.request.Request(
                  "https://api.github.com/repos/azerish25-ux/S23-ultra-camera-log-application/git/blobs/" + object_sha,
                  headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"], "Accept": "application/vnd.github+json"},
              )
              with urllib.request.urlopen(request, timeout=60) as response:
                  data = base64.b64decode(json.load(response)["content"])
              actual_object = hashlib.sha1(b"blob " + str(len(data)).encode() + b"\0" + data).hexdigest()
              assert actual_object == object_sha, (actual_object, object_sha)
              assert len(data) == expected_size, (len(data), expected_size)
              assert hashlib.sha256(data).hexdigest() == expected_sha256
              bundle.extend(data)
          assert len(bundle) == 49790
          assert hashlib.sha256(bundle).hexdigest() == "45b352e0a7b1672deebf6e9f343797c690f3ace536f485cd774ce59fc71c5d4d"
          pathlib.Path(os.environ["RUNNER_TEMP"], "p005.bundle").write_bytes(bundle)
          PY
          git bundle verify "$RUNNER_TEMP/p005.bundle"

      - name: Import exact commits and execute their gates
        run: |
          set -euo pipefail
          trigger="$(git rev-parse HEAD)"
          base=c1386a4b9376403ac70dd35c6609dbe5a2bd5116
          git merge-base --is-ancestor "$base" "$trigger"
          test "$(git diff --name-only "$base" "$trigger")" = .github/workflows/publish-p005.yml
          git fetch "$RUNNER_TEMP/p005.bundle" refs/heads/main:refs/remotes/saved/p005
          test "$(git rev-parse refs/remotes/saved/p005)" = e028e98ed11714beb497afa1353e356848eb0198
          test "$(git rev-parse e028e98ed11714beb497afa1353e356848eb0198^)" = 9ea528cde9149891ed4f54ef93080da19c7be0a7
          test "$(git rev-parse 9ea528cde9149891ed4f54ef93080da19c7be0a7^)" = "$base"
          test "$(git rev-parse 9ea528cde9149891ed4f54ef93080da19c7be0a7^{tree})" = cc89fec54afaaf26a9804b761fda31ecc790d254
          test "$(git rev-parse e028e98ed11714beb497afa1353e356848eb0198^{tree})" = 7933f7cf3252475afab7a5d4d397bc51e2d1e4ee
          test -z "$(git ls-tree 7933f7cf3252475afab7a5d4d397bc51e2d1e4ee .github/workflows/publish-p005.yml)"

          git checkout --detach e028e98ed11714beb497afa1353e356848eb0198
          python3 scripts/measurements.py validate-registry --expected-head e028e98ed11714beb497afa1353e356848eb0198
          python3 -m unittest discover -s scripts/tests -p 'test_measurements.py' -v
          python3 -m unittest discover -s scripts/tests -v
          python3 scripts/verify_master_directive.py
          python3 scripts/verify_research_contract.py --expected-head e028e98ed11714beb497afa1353e356848eb0198
          python3 scripts/verify_repository_continuity.py --expected-head e028e98ed11714beb497afa1353e356848eb0198
          python3 -m unittest discover -s docs/master-directive/reference -p 'test_reference.py' -v
          git diff --exit-code

          git config user.name "azerish25-ux"
          git config user.email "azerish25@gmail.com"
          message="$RUNNER_TEMP/merge-message.txt"
          cat > "$message" <<'EOF'
          Publish verified P005 measurement uncertainty implementation

          Merge the exact saved P005 implementation and evidence commits into main while preserving their original identities. The final tree is the tested e028e98 snapshot and removes the temporary publisher.

          The publication runner independently verified the registry, 28 focused P005 cases, 310 host regressions, 53 preserved reference tests, directive integrity, research contract, source continuity, and retained mutation evidence. Earlier transfer and missing-prerequisite failures remain preserved in workflow history. No Android source, capture path, build pin, numerical imaging threshold, or preserved directive file changed.

          This establishes host-side measurement semantics only. Physical S23 cadence/content integrity, calibrated colour, effective sensor precision, and dynamic-range claims remain unqualified. P006 is the next dependency-ready phase.
          EOF
          merge="$(git commit-tree 7933f7cf3252475afab7a5d4d397bc51e2d1e4ee -p "$trigger" -p e028e98ed11714beb497afa1353e356848eb0198 < "$message")"
          test "$(git rev-parse "$merge^{tree}")" = 7933f7cf3252475afab7a5d4d397bc51e2d1e4ee
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$trigger"
          git push origin "$merge:refs/heads/main"
          mkdir -p publication
          printf '%s\n' "$trigger" > publication/trigger-commit.txt
          printf '%s\n' "$merge" > publication/final-commit.txt
          printf '%s\n' e028e98ed11714beb497afa1353e356848eb0198 > publication/saved-head.txt
          git show --no-patch --format=fuller "$merge" > publication/final-commit.txt.full

      - name: Retain publication proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: P005-publication-proof
          path: publication/
          if-no-files-found: warn
